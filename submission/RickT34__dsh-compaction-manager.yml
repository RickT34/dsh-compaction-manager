name: RickT34/dsh-compaction-manager
category: session
description:
  en: 'Compaction settings panel: orders model-free compaction steps (official head/tail pruner, Magic Compact-style output omission, DCP-style dedupe and error purge, tool-call folding), tunes compaction-basic, previews savings on a session, and adds a restore_context tool for hidden content.'
  zh: 压缩设置面板：排列不调用模型的压缩步骤（官方首尾裁剪、仿 Magic Compact 的输出省略、仿 DCP 的去重与出错清理、工具调用折叠），调整 compaction-basic 参数，在会话上预览节省量，并提供 restore_context 工具取回被隐藏的内容。
icon: https://raw.githubusercontent.com/RickT34/dsh-compaction-manager/main/assets/icon-180.png
